<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arsip Peta Dinas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --glass: rgba(15, 23, 42, 0.92); --text: #f8fafc; --accent: #3b82f6; --success: #10b981; --danger: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #0f172a; color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }

    #upload-screen { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #0f172a; z-index: 100; transition: 0.3s; }
    #upload-screen.hidden { opacity: 0; pointer-events: none; }
    .upload-box { background: #1e293b; padding: 2rem; border-radius: 12px; text-align: center; max-width: 400px; width: 90%; border: 1px solid #334155; }
    .upload-box h2 { margin-bottom: 0.5rem; color: white; }
    .upload-box p { color: #94a3b8; margin-bottom: 1rem; font-size: 0.95rem; }
    input[type="file"] { display: none; }
    .btn { padding: 12px 20px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; }
    .btn:hover { background: #2563eb; }

    /* Container Dinamis */
    #archive-container { position: relative; background: #000; display: none; box-shadow: 0 12px 32px rgba(0,0,0,0.6); margin: 0 auto; overflow: hidden; border-radius: 4px; }
    #archive-container.active { display: block; }
    #bg-photo { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* Panel Data (Ditinggikan & Diperjelas) */
    #info-panel {
      position: absolute; bottom: 20px; left: 20px; right: 20px;
      background: var(--glass); backdrop-filter: blur(12px);
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
      padding: 12px; display: flex; gap: 12px; align-items: stretch;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    #mini-map { flex: 1; min-width: 30%; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); background: #334155; }
    
    #data-section { flex: 2; display: flex; flex-direction: column; overflow: hidden; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .panel-header h3 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .panel-header span { background: rgba(255,255,255,0.15); padding: 3px 8px; border-radius: 20px; font-size: 12px; font-weight: 500; }

    #loc-list { list-style: none; overflow-y: auto; flex: 1; padding-right: 4px; font-size: 13px; }
    .loc-item { background: rgba(255,255,255,0.05); border-radius: 6px; padding: 6px 8px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .loc-main { display: flex; flex-direction: column; gap: 2px; }
    .loc-time { font-weight: 600; color: #93c5fd; font-size: 13px; }
    .loc-meta { display: flex; gap: 8px; align-items: center; }
    .loc-coords { font-family: 'JetBrains Mono', monospace; color: #cbd5e1; font-size: 12px; }
    .loc-note { color: #e2e8f0; font-size: 13px; }
    .loc-actions button { background: none; border: none; color: #60a5fa; cursor: pointer; padding: 0 4px; font-size: 14px; transition: 0.2s; }
    .loc-actions button:hover { color: white; transform: scale(1.1); }
    .btn-delete { color: #f87171 !important; }

    .controls { display: flex; gap: 6px; margin-top: 8px; }
    .controls button { padding: 6px 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .controls button:hover { background: rgba(255,255,255,0.2); }
    .btn-active { background: var(--success) !important; border-color: var(--success) !important; color: white !important; }

    /* Modal Input (Pengganti Popup Kecil) */
    #input-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 200; }
    #input-modal.active { display: flex; }
    .modal-card { background: #1e293b; padding: 20px; border-radius: 12px; width: 90%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    .modal-card h3 { margin-bottom: 12px; font-size: 16px; color: white; display: flex; align-items: center; gap: 8px; }
    .modal-coords { background: #0f172a; padding: 6px 10px; border-radius: 6px; font-family: monospace; font-size: 13px; color: #94a3b8; margin-bottom: 14px; border: 1px solid #334155; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 13px; color: #cbd5e1; font-weight: 500; }
    .form-group input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .btn-save { background: var(--success); color: white; }
    .btn-save:hover { background: #059669; }
    .btn-cancel { background: #475569; color: white; }
    .btn-cancel:hover { background: #334155; }

    @media (max-width: 600px) {
      #info-panel { flex-direction: column; bottom: 10px; left: 10px; right: 10px; padding: 10px; }
      #mini-map { height: 100px; min-width: 100%; }
      #data-section { flex: 1; }
      .modal-card { width: 95%; }
    }
  </style>
</head>
<body>
  <div id="upload-screen">
    <div class="upload-box">
      <h2>📷 Arsip Kegiatan Dinas</h2>
      <p>Upload foto dokumentasi. Data lokasi akan tampil jelas di atas foto.</p>
      <label class="btn">Pilih Foto<input type="file" id="photo-input" accept="image/*"></label>
    </div>
  </div>

  <div id="archive-container">
    <img id="bg-photo" src="" alt="Arsip">
    <div id="info-panel">
      <div id="mini-map"></div>
      <div id="data-section">
        <div class="panel-header"><h3>📍 Titik Lokasi Kegiatan</h3><span id="count-badge">0</span></div>
        <ul id="loc-list"></ul>
        <div class="controls">
          <button id="toggle-add">📌 Tambah Titik</button>
          <button id="btn-download">📥 Unduh Arsip</button>
          <button id="btn-reset">🔄 Reset</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Input -->
  <div id="input-modal">
    <div class="modal-card">
      <h3>📌 Input Data Lokasi</h3>
      <div class="modal-coords" id="modal-coords-display">📍 -.-, -.-</div>
      <div class="form-group">
        <label>Waktu Kegiatan</label>
        <input type="datetime-local" id="m-time">
      </div>
      <div class="form-group">
        <label>Nama / Keterangan Kegiatan</label>
        <input type="text" id="m-note" placeholder="Contoh: Survey lahan, koordinasi dinas...">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Batal</button>
        <button class="btn-save" onclick="saveFromModal()">💾 Simpan</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
