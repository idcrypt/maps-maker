<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps Maker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg: #0f172a; --panel: #ffffff; --border: #e2e8f0; --primary: #3b82f6; --danger: #ef4444; --text: #1e293b; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); }
    
    .app-container { display: flex; flex-direction: column; height: 100vh; }
    
    /* Header */
    .app-header { background: #1e293b; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; z-index: 1000; }
    .app-header h1 { font-size: 1.1rem; font-weight: 600; }
    .controls { display: flex; gap: 6px; flex-wrap: wrap; }
    .controls button { padding: 7px 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: 0.2s; }
    .controls button:hover { background: #2563eb; }
    .controls button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Layout Utama: Peta 7/8, Footnote 1/8 */
    .main-content { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
    #map { flex: 7; width: 100%; min-height: 0; z-index: 1; }
    
    /* Footnote Panel */
    #footnote-panel { flex: 1; min-height: 80px; max-height: 12.5vh; background: var(--panel); border-top: 2px solid var(--border); display: flex; flex-direction: column; z-index: 900; }
    .panel-header { padding: 8px 12px; background: #f8fafc; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .panel-header h3 { font-size: 0.95rem; color: #334155; }
    .panel-header span { font-size: 0.8rem; color: var(--muted); background: #e2e8f0; padding: 2px 6px; border-radius: 10px; }

    #locations-list { list-style: none; overflow-y: auto; padding: 0; margin: 0; flex: 1; }
    .loc-item { padding: 9px 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: background 0.2s; }
    .loc-item:hover { background: #f8fafc; }
    .loc-item.active { background: #eff6ff; border-left: 3px solid var(--primary); }
    .loc-header { display: flex; justify-content: space-between; align-items: center; }
    .loc-time { font-weight: 600; font-size: 0.9rem; }
    .loc-coords { font-size: 0.78rem; color: var(--muted); font-family: 'Courier New', monospace; background: #f1f5f9; padding: 2px 5px; border-radius: 4px; }
    .loc-note { font-size: 0.82rem; color: #475569; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .loc-actions { margin-top: 5px; display: flex; gap: 6px; }
    .loc-actions button { padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; border: none; cursor: pointer; font-weight: 500; }
    .btn-view { background: #e2e8f0; color: #1e293b; }
    .btn-del { background: #fee2e2; color: #dc2626; }

    /* Responsive */
    @media (max-width: 600px) {
      .app-header { flex-direction: column; align-items: flex-start; }
      .controls { width: 100%; justify-content: flex-start; }
      #footnote-panel { max-height: 20vh; }
    }
  </style>
</head>
<body>
  <div class="app-container" id="capture-area">
    <header class="app-header">
      <h1>📍 Maps Maker</h1>
      <div class="controls">
        <button id="add-btn">📌 Tambah Marker</button>
        <button id="export-img">📸 Unduh Gambar</button>
        <button id="export-json">💾 Backup</button>
        <button id="import-json">📂 Load</button>
        <input type="file" id="import-input" accept=".json" hidden>
      </div>
    </header>

    <div class="main-content">
      <div id="map"></div>
      <div id="footnote-panel">
        <div class="panel-header">
          <h3>📋 Data Lokasi</h3>
          <span id="marker-count">0 lokasi</span>
        </div>
        <ul id="locations-list"></ul>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
