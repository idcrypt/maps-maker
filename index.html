<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arsip Peta Dinas - Maps Maker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --primary: #2563eb; --success: #10b981; --danger: #ef4444; --dark: #0f172a; --glass: rgba(15, 23, 42, 0.85); --text: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden; background: #1e293b; color: var(--text); }

    /* Upload Screen */
    #upload-screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, #1e293b, #0f172a); z-index: 100; transition: opacity 0.4s; }
    #upload-screen.hidden { opacity: 0; pointer-events: none; }
    .upload-box { background: white; padding: 2rem; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); max-width: 400px; width: 90%; }
    .upload-box h2 { margin-bottom: 0.5rem; color: #1e293b; }
    .upload-box p { color: #64748b; margin-bottom: 1.2rem; font-size: 0.9rem; }
    input[type="file"] { display: none; }
    .btn-upload { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn-upload:hover { background: #1d4ed8; }

    /* Archive Container */
    #archive-container { position: relative; width: 100%; height: 100vh; display: none; }
    #archive-container.active { display: block; }
    #bg-photo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

    /* Bottom Overlay Panel (1/8 layar) */
    #bottom-panel {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 12.5vh; min-height: 90px; max-height: 110px;
      background: var(--glass); backdrop-filter: blur(8px);
      display: flex; gap: 12px; padding: 10px; z-index: 10;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    #mini-map { flex: 2; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
    #data-section { flex: 3; display: flex; flex-direction: column; color: white; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .panel-header h3 { font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .panel-header span { font-size: 0.75rem; background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px; }
    
    #loc-list { list-style: none; overflow-y: auto; flex: 1; margin-right: 8px; }
    .loc-item { padding: 4px 6px; font-size: 0.82rem; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
    .loc-item:last-child { border-bottom: none; }
    .loc-time { font-weight: 600; color: #93c5fd; }
    .loc-coords { font-family: monospace; font-size: 0.75rem; color: #cbd5e1; }
    .loc-note { font-size: 0.78rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
    .loc-actions button { background: transparent; border: none; color: #60a5fa; cursor: pointer; font-size: 0.75rem; padding: 0 4px; }
    .loc-actions button:hover { color: white; }

    .controls { display: flex; gap: 6px; margin-top: 4px; }
    .controls button { padding: 5px 10px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 6px; cursor: pointer; font-size: 0.78rem; transition: 0.2s; }
    .controls button:hover { background: rgba(255,255,255,0.25); }
    .controls button.btn-active { background: var(--success); border-color: var(--success); }
    .controls button.btn-download { background: var(--primary); }

    /* Popup Form */
    .leaflet-popup-content-wrapper { background: #1e293b; color: white; border-radius: 8px; }
    .leaflet-popup-content { margin: 8px 12px; }
    .popup-form label { display: block; margin: 5px 0 2px; font-size: 0.82rem; color: #cbd5e1; }
    .popup-form input { width: 100%; padding: 5px; border: 1px solid #475569; border-radius: 4px; background: #0f172a; color: white; font-size: 0.85rem; }
    .popup-form .btn-group { display: flex; gap: 8px; margin-top: 8px; }
    .popup-form .btn-group button { flex: 1; padding: 6px; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
    .btn-save { background: var(--success); color: white; }
    .btn-cancel { background: #475569; color: white; }

    @media (max-width: 600px) {
      #bottom-panel { flex-direction: column; height: auto; max-height: 35vh; }
      #mini-map { height: 40%; flex: none; }
      #data-section { flex: 1; }
    }
  </style>
</head>
<body>

  <!-- Upload Screen -->
  <div id="upload-screen">
    <div class="upload-box">
      <h2>📷 Arsip Kegiatan Dinas</h2>
      <p>Upload foto lokasi kegiatan. Peta & data akan muncul di overlay bawah.</p>
      <label class="btn-upload">
        Pilih Foto
        <input type="file" id="photo-input" accept="image/*">
      </label>
    </div>
  </div>

  <!-- Main Archive Container -->
  <div id="archive-container">
    <img id="bg-photo" src="" alt="Foto Arsip">
    <div id="bottom-panel">
      <div id="mini-map"></div>
      <div id="data-section">
        <div class="panel-header">
          <h3>📍 Data Titik Lokasi</h3>
          <span id="count-badge">0 titik</span>
        </div>
        <ul id="loc-list"></ul>
        <div class="controls">
          <button id="toggle-add">📌 Tambah Titik</button>
          <button id="btn-download">📥 Unduh Arsip</button>
          <button id="btn-reset">🔄 Reset</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    let map, markers = [], locations = [];
    let isAdding = false;

    const $ = id => document.getElementById(id);
    const now = () => new Date().toISOString().slice(0, 16);

    // 1. Inisialisasi
    document.addEventListener('DOMContentLoaded', () => {
      loadData();
      $('photo-input').addEventListener('change', handlePhoto);
      $('toggle-add').addEventListener('click', toggleAddMode);
      $('btn-download').addEventListener('click', downloadArchive);
      $('btn-reset').addEventListener('click', resetData);
    });

    function handlePhoto(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        $('bg-photo').src = ev.target.result;
        $('upload-screen').classList.add('hidden');
        $('archive-container').classList.add('active');
        setTimeout(() => {
          map = L.map('mini-map', { zoomControl: false }).setView([-1.6101, 103.6131], 11);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            crossOrigin: 'anonymous', attribution: '© OSM'
          }).addTo(map);
          map.invalidateSize();
          map.on('click', handleMapClick);
          renderMarkers();
          renderList();
        }, 100);
      };
      reader.readAsDataURL(file);
    }

    // 2. Tambah Marker
    function toggleAddMode() {
      isAdding = !isAdding;
      $('toggle-add').classList.toggle('btn-active', isAdding);
      map.getContainer().style.cursor = isAdding ? 'crosshair' : 'default';
    }

    function handleMapClick(e) {
      if (!isAdding) return;
      const content = `
        <div class="popup-form">
          <label>Waktu Kegiatan</label>
          <input type="datetime-local" id="p-time" value="${now()}">
          <label>Catatan / Nama Kegiatan</label>
          <input type="text" id="p-note" placeholder="Contoh: Survey lapangan, rapat koordinasi...">
          <div class="btn-group">
            <button class="btn-save" onclick="savePoint(${e.latlng.lat}, ${e.latlng.lng})">💾 Simpan</button>
            <button class="btn-cancel" onclick="map.closePopup()">Batal</button>
          </div>
        </div>
      `;
      L.popup().setLatLng(e.latlng).setContent(content).openOn(map);
    }

    window.savePoint = (lat, lng) => {
      const time = $('p-time').value || now();
      const note = $('p-note').value.trim();
      locations.push({ id: Date.now().toString(), lat, lng, time, note });
      saveData();
      renderMarkers();
      renderList();
      toggleAddMode();
      map.closePopup();
    };

    function renderMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      locations.forEach(loc => {
        const m = L.marker([loc.lat, loc.lng]).addTo(map);
        m.bindPopup(`<b>${loc.time}</b><br>${loc.note || 'Tanpa catatan'}<br><small>${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)}</small>`);
        markers.push(m);
      });
      $('count-badge').textContent = `${locations.length} titik`;
    }

    function renderList() {
      const list = $('loc-list');
      list.innerHTML = '';
      locations.slice().reverse().forEach(loc => {
        const li = document.createElement('li');
        li.className = 'loc-item';
        li.innerHTML = `
          <div>
            <div class="loc-time">🕒 ${loc.time}</div>
            <div class="loc-coords">📍 ${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}</div>
            <div class="loc-note">${loc.note || '-'}</div>
          </div>
          <div class="loc-actions">
            <button onclick="focusLoc('${loc.id}')">🔍</button>
            <button onclick="deleteLoc('${loc.id}')" style="color:#f87171;">🗑️</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    window.focusLoc = id => {
      const idx = locations.findIndex(l => l.id === id);
      if (idx !== -1) {
        const loc = locations[idx];
        map.flyTo([loc.lat, loc.lng], 14);
        markers[idx].openPopup();
      }
    };

    window.deleteLoc = id => {
      if (!confirm('Hapus titik ini?')) return;
      locations = locations.filter(l => l.id !== id);
      saveData();
      renderMarkers();
      renderList();
    };

    // 3. Storage & Export
    function saveData() {
      try { localStorage.setItem('arsip_dinas_data', JSON.stringify(locations)); } catch {}
    }
    function loadData() {
      try { const d = localStorage.getItem('arsip_dinas_data'); if (d) locations = JSON.parse(d); } catch {}
    }
    function resetData() {
      if (!confirm('Hapus semua data & foto?')) return;
      locations = []; markers = [];
      localStorage.removeItem('arsip_dinas_data');
      $('bg-photo').src = '';
      $('archive-container').classList.remove('active');
      $('upload-screen').classList.remove('hidden');
      $('photo-input').value = '';
      if (map) map.remove(); map = null;
    }

    async function downloadArchive() {
      const btn = $('btn-download');
      btn.textContent = '⏳ Menyiapkan...'; btn.disabled = true;
      $('toggle-add').style.display = 'none'; $('btn-download').style.display = 'none'; $('btn-reset').style.display = 'none';

      await new Promise(r => setTimeout(r, 300));
      try {
        const canvas = await html2canvas($('archive-container'), {
          useCORS: true, allowTaint: true, scale: 2, backgroundColor: '#0f172a',
          logging: false, windowWidth: window.innerWidth, windowHeight: window.innerHeight
        });
        canvas.toBlob(blob => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `arsip_dinas_${new Date().toISOString().slice(0,10)}.png`;
          a.click();
          URL.revokeObjectURL(a.href);
        }, 'image/png');
      } catch (e) {
        console.error(e);
        alert('Gagal mengunduh. Pastikan tile peta sudah termuat penuh.');
      } finally {
        btn.textContent = '📥 Unduh Arsip'; btn.disabled = false;
        $('toggle-add').style.display = ''; $('btn-download').style.display = ''; $('btn-reset').style.display = '';
      }
    }
  </script>
</body>
</html>
